<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Book a train ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <main class="container py-4">
      <div class="row justify-content-center"><div class="col-xl-9">
        <div class="card-form">
          <h1>Book a train ticket</h1>
          <form class="body" action="#" method="get">
            <div class="row g-3">
              <div class="col-12">
                <div class="btn-group seg" role="group" aria-label="Trip type">
                  <input class="btn-check" type="radio" name="trip" id="oneway" value="oneway" checked>
                  <label class="btn" for="oneway">One way</label>
                  <input class="btn-check" type="radio" name="trip" id="round" value="round">
                  <label class="btn" for="round">Round trip</label>
                </div>
              </div>
              <div class="col-md-6"><div class="form-floating">
                <input class="form-control" id="from" name="from" placeholder="Astana" required>
                <label for="from">From</label></div></div>
              <div class="col-md-6"><div class="form-floating">
                <input class="form-control" id="to" name="to" placeholder="Almaty" required>
                <label for="to">To</label></div></div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="dep">Departure</label>
                <input class="form-control" type="date" id="dep" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="ret">Return</label>
                <input class="form-control" type="date" id="ret" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="pax">Passengers</label>
                <select class="form-select" id="pax" name="passengers">
                  <option value="1">1 adult</option><option value="2">2 adults</option>
                  <option value="3">3 adults</option><option value="4">4 adults</option>
                  <option value="5">5 adults</option><option value="6">6 adults</option>
                </select>
              </div>
              <div class="col-12">
                <fieldset>
                  <legend>Carriage class</legend>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="class" id="c1" value="seat" required>
                    <label class="form-check-label" for="c1">Seat</label></div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="class" id="c2" value="coupe">
                    <label class="form-check-label" for="c2">Coupé</label></div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="class" id="c3" value="sleeper">
                    <label class="form-check-label" for="c3">Sleeper</label></div>
                </fieldset>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone</label>
                <div class="input-group phone">
                  <span class="input-group-text">+7</span>
                  <input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" required>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" required>
              </div>
              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label></div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                  <label class="form-check-label" for="agree">I agree with the carriage rules</label></div>
              </div>
              <div class="col-12 d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                <button class="btn btn-clear" type="reset">Clear</button>
                <button class="btn btn-find" type="submit">Find trains</button>
              </div>
            </div>
          </form>
        </div>
      </div></div>
    </main>
  </body>
</html>
